<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>致许晨露</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Microsoft YaHei", cursive, sans-serif;
      overflow: hidden;
      height: 100vh;
      position: relative;
    }

    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: white;
      text-align: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 20px;
    }

    .page.active {
      display: flex;
    }

    .page h1 {
      font-size: 2.4rem;
      margin-bottom: 20px;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
      line-height: 1.4;
    }

    .page p {
      font-size: 1.4rem;
      max-width: 800px;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
      line-height: 1.6;
    }

    /* 音乐按钮 */
    #playBtn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: red;
      color: white;
      padding: 10px 15px;
      border-radius: 30px;
      font-size: 14px;
      cursor: pointer;
      z-index: 9999;
      display: block;
    }

    /* 下一页按钮 */
    #nextBtn {
      position: absolute;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 0, 0, 0.7);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 30px;
      font-size: 1.2rem;
      cursor: pointer;
      z-index: 10;
      display: block;
    }

    /* 第七页特殊样式 */
    #fireworks {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      font-size: 3rem;
      color: red;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
      animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.8; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- 背景音乐 -->
  <audio id="bgm" loop>
    <source src="./music.mp3" type="audio/mpeg">
  </audio>
  <div id="playBtn">▶ 播放音乐</div>

  <!-- 页面1 -->
  <div class="page active" style="background-image: url('./images/bg1.jpg');">
    <h1>猜猜我要说啥</h1>
    <button id="nextBtn">下一页 ❤️</button>
  </div>

  <!-- 页面2 -->
  <div class="page" style="background-image: url('./images/bg2.jpg');">
    <h1>嗯</h1>
    <button id="nextBtn">下一页 💖</button>
  </div>

  <!-- 页面3 -->
  <div class="page" style="background-image: url('./images/bg2.jpg');">
    <h1>嗯嗯</h1>
    <button id="nextBtn">下一页 🌸</button>
  </div>

  <!-- 页面4 -->
  <div class="page" style="background-image: url('./images/bg2.jpg');">
    <h1>嗯嗯嗯</h1>
    <button id="nextBtn">下一页 🌙</button>
  </div>

  <!-- 页面5 -->
  <div class="page" style="background-image: url('./images/bg2.jpg');">
    <h1>我想想</h1>
    <button id="nextBtn">下一页 ⭐</button>
  </div>

  <!-- 页面6 -->
  <div class="page" style="background-image: url('./images/bg2.jpg');">
    <h1>恭喜你猜对啦</h1>
    <button id="nextBtn">最后一页 💫</button>
  </div>

  <!-- 页面7：表白页 -->
  <div class="page" style="background-image: url('./images/love_bg.jpg');">
    <div id="message">宝，情人节快乐！</div>
    <canvas id="fireworks"></canvas>
    <!-- 最后一页不需要“下一页”按钮 -->
  </div>

  <script>
    // === 页面切换逻辑 ===
    let currentPage = 0;
    const pages = document.querySelectorAll('.page');
    const nextButtons = document.querySelectorAll('#nextBtn');

    function nextPage() {
      if (currentPage < pages.length - 1) {
        pages[currentPage].classList.remove('active');
        currentPage++;
        pages[currentPage].classList.add('active');
      }
    }

    nextButtons.forEach(btn => {
      btn.addEventListener('click', nextPage);
    });

    // === 背景音乐控制 ===
    const audio = document.getElementById('bgm');
    const playBtn = document.getElementById('playBtn');

    function tryPlay() {
      audio.play().then(() => {
        playBtn.style.display = 'none';
      }).catch(() => {
        playBtn.style.display = 'block';
      });
    }

    playBtn.addEventListener('click', tryPlay);
    window.addEventListener('load', tryPlay);

    // === 烟花动画（仅第七页）===
    const canvas = document.getElementById('fireworks');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.radius = Math.random() * 2 + 1;
        this.velocity = {
          x: (Math.random() - 0.5) * 6,
          y: (Math.random() - 0.5) * 6
        };
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.01;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.velocity.y += 0.03;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= this.decay;
        this.draw();
        return this.alpha > 0;
      }
    }

    const colors = ['#ff0066', '#ffcc00', '#00ccff', '#ff66cc', '#66ff66', '#ff9900'];
    let particles = [];

    function createFirework(x, y) {
      const color = colors[Math.floor(Math.random() * colors.length)];
      for (let i = 0; i < 80; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles = particles.filter(p => p.update());

      // 自动发射烟花（只在第七页显示时才放）
      if (currentPage === 6 && Math.random() < 0.03) {
        createFirework(
          Math.random() * canvas.width,
          Math.random() * canvas.height / 2
        );
      }
    }

    animate();

    // 页面加载后，在第七页自动放几朵烟花
    setTimeout(() => {
      if (currentPage === 6) {
        for (let i = 0; i < 4; i++) {
          setTimeout(() => {
            createFirework(
              Math.random() * canvas.width,
              Math.random() * canvas.height / 2
            );
          }, i * 600);
        }
      }
    }, 1000);
  </script>
</body>
</html>
